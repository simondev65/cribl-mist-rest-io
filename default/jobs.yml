  description: "Device health / radio / port statistics snapshot - GET
    /api/v1/orgs/<org_id>/stats/devices. This is the org-wide equivalent of the
    per-site 'AP stats' endpoint, so no site fan-out is needed. Returns a bare
    JSON array (no 'results' envelope) with page/limit pagination, and the
