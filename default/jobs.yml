  streamtags:
    - juniper
    - mist
  workerAffinity: false
  schedule:
    enabled: false
    cronSchedule: "*/15 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    resumeMissed: false
    run:
      mode: run
      rescheduleDroppedTasks: false
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 20m
      timeRangeType: relative
      earliest: -15m
      latest: now
      timestampTimezone: UTC
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        enabled: false
  collector:
    type: rest
    destructive: false
    encoding: utf8
    conf:
      discovery:
        discoverType: none
      collectUrl: "`https://${C.vars['mist_api_host']}/api/v1/orgs/${C.vars['mis\
        t_org_id']}/stats/devices`"
      collectMethod: get
      collectRequestHeaders:
        - name: Authorization
