in_mist_org_audit_logs:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  description: "Org admin audit trail - GET /api/v1/orgs/<org_id>/logs. Who
    changed what in the Mist portal/API. Uses page/limit pagination (this
    endpoint accepts a 'page' parameter; the /search endpoints do not)."
  streamtags:
    - juniper
    - mist
  workerAffinity: false
  schedule:
    enabled: false
    cronSchedule: "*/5 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    resumeMissed: false
    run:
      mode: run
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 10m
      timeRangeType: relative
      earliest: -15m
      latest: now
      timestampTimezone: UTC
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        enabled: true
        stateUpdateExpression: "__timestampExtracted !== false && { latestTime:
          (state.latestTime || 0) > _time ? state.latestTime : _time }"
        stateMergeExpression: "(prevState.latestTime || 0) > newState.latestTime
          ? prevState : newState"
  collector:
    type: rest
    destructive: false
    encoding: utf8
    conf:
      discovery:
        discoverType: none
      collectUrl: "`https://${C.vars['mist_api_host']}/api/v1/orgs/${C.vars['mis\
        t_org_id']}/logs`"
      collectMethod: get
      collectRequestHeaders:
        - name: Authorization
          value: "`Token ${C.Secret('mist_api_token').value}`"
        - name: Accept
          value: "'application/json'"
      collectRequestParams:
        - name: start
          value: "`${state && state.latestTime ? state.latestTime : earliest}`"
        - name: end
          value: "`${latest}`"
        - name: sort
          value: "'timestamp'"
      # Page/Size pagination. Cribl's schema calls this type "request_page" and
      # names the fields pageField/page/sizeField/size - none of them accept a
      # JS expression, so the record limit is a literal here rather than
      # C.vars['mist_page_limit'].
      pagination:
        type: request_page
        pageField: page
        page: 1
        sizeField: limit
        size: 1000
        zeroIndexed: false
        totalRecordField: total
        maxPages: 0
      authentication: none
      timeout: 60
      useRoundRobinDns: false
      disableTimeFilter: true
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: false
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 60000
        codes:
          - 429
          - 500
          - 502
          - 503
          - 504
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - Juniper Mist API Ruleset
    pipeline: cribl_mist_parse
    output: default
    metadata:
      - name: __packsource
        value: "'cribl-mist-rest-io.mist-api'"
      - name: mist_dataset
        value: "'audit_logs'"
  savedState: {}
  notifications: []

