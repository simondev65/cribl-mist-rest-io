    /api/v1/orgs/<org_id>/devices/search. Model, MAC/SKU, firmware version, site
    assignment and LLDP neighbour per AP/switch/gateway. The endpoint's 'type'
    parameter has no 'all' value (enum: ap, gateway, switch), so this collector
    uses Item List discovery to issue one request per device type. State data,
    not an event stream, so no state tracking - each run is a full snapshot."
  streamtags:
    - juniper
    - mist
  workerAffinity: false
  schedule:
    enabled: false
    cronSchedule: "17 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    resumeMissed: false
    run:
      mode: run
      rescheduleDroppedTasks: false
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 20m
      timeRangeType: relative
      earliest: -1h
      latest: now
      timestampTimezone: UTC
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        enabled: false
  collector:
    type: rest
    destructive: false
    encoding: utf8
    conf:
      discovery:
        discoverType: list
        itemList:
          - ap
          - switch
          - gateway
      collectUrl: "`https://${C.vars['mist_api_host']}/api/v1/orgs/${C.vars['mis\
        t_org_id']}/devices/search`"
      collectMethod: get
      collectRequestHeaders:
        - name: Authorization
          value: "`Token ${C.Secret('mist_api_token').value}`"
        - name: Accept
          value: "'application/json'"
      collectRequestParams:
        - name: type
          value: "`${id}`"
        - name: limit
          value: "`${C.vars['mist_page_limit']}`"
        - name: sort
          value: "'timestamp'"
      pagination:
        type: response_body
        attribute:
          - next
        lastPageExpr: "!next"
        maxPages: 0
      authentication: none
      timeout: 60
      useRoundRobinDns: false
      disableTimeFilter: true
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: false
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 60000
        codes:
          - 429
          - 500
          - 502
          - 503
          - 504
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
