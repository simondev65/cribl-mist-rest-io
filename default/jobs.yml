in_mist_site_rogue_events:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  description: "Rogue AP / honeypot / neighbour detections - GET
    /api/v1/sites/<site_id>/rogues/events/search. This endpoint is site-scoped
    only (there is no org-level equivalent), so it uses HTTP Discovery against
    /api/v1/orgs/<org_id>/sites to enumerate every site and issues one Collect
    task per site. Use this collector as the template for any other site-scoped
    Mist endpoint. Note the request budget: one discovery call plus one call per
    site per run, against a 5000 calls/hour token limit."
  streamtags:
    - juniper
    - mist
  workerAffinity: false
  schedule:
    enabled: false
    cronSchedule: "*/15 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    resumeMissed: false
    run:
      mode: run
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 20m
      timeRangeType: relative
      earliest: -30m
      latest: now
      timestampTimezone: UTC
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      discoverToRoutes: false
      stateTracking:
        enabled: false
  collector:
    type: rest
    destructive: false
    encoding: utf8
    conf:
      discovery:
        discoverType: http
        discoverUrl: "`https://${C.vars['mist_api_host']}/api/v1/orgs/${C.vars['\
          mist_org_id']}/sites`"
        discoverMethod: get
        discoverRequestHeaders:
          - name: Authorization
            value: "`Token ${C.Secret('mist_api_token').value}`"
          - name: Accept
            value: "'application/json'"
        discoverRequestParams:
          - name: limit
            value: "'1000'"
        discoverDataField: ""
        pagination:
          type: request_page
          pageField: page
          page: 1
          sizeField: limit
          size: 1000
          zeroIndexed: false
          maxPages: 10
      collectUrl: "`https://${C.vars['mist_api_host']}/api/v1/sites/${id}/rogues\
        /events/search`"
      collectMethod: get
      collectRequestHeaders:
        - name: Authorization
          value: "`Token ${C.Secret('mist_api_token').value}`"
        - name: Accept
          value: "'application/json'"
      # No 'type' filter, so all four rogue classes (honeypot, lan, others,
      # spoof) are collected. Mist does NOT echo the class back in the response
      # - a rogue event is only {ap, bssid, ssid, channel, rssi, timestamp} - so
      # cribl_mist_ocsf cannot derive severity from it. If you need per-class
      # severity, clone this collector, add type=<class> here, and add a
      # matching mist_rogue_type entry under input.metadata below.
      collectRequestParams:
        - name: start
          value: "`${Math.round(Date.now() / 1000) - C.vars['mist_lookback_secon\
            ds']}`"
        - name: end
          value: "`${Math.round(Date.now() / 1000)}`"
        - name: limit
          value: "`${C.vars['mist_page_limit']}`"
        - name: sort
          value: "'timestamp'"
      pagination:
        type: response_body
        attribute:
          - next
        lastPageExpr: "!next"
        maxPages: 0
      authentication: none
      timeout: 60
      useRoundRobinDns: false
      disableTimeFilter: true
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: false
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 60000
        codes:
          - 429
          - 500
          - 502
          - 503
          - 504
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - Juniper Mist API Ruleset
    pipeline: cribl_mist_parse
    output: default
    metadata:
      - name: __packsource
        value: "'cribl-mist-rest-io.mist-api'"
      - name: mist_dataset
        value: "'rogue_events'"
      # The discovery result object is a Mist site: {id, name, org_id, ...}.
      # Rogue events themselves carry no site_id, so stamp it here.
      - name: mist_site_id
        value: "`${__collectible.id}`"
      - name: mist_site_name
        value: "`${__collectible.name}`"
  savedState: {}
  notifications: []
