output: default
streamtags: []
groups:
  emit:
    name: Serialize & Emit
    description: JSON into _raw, then strict whitelist cleanup
    index: 1
    disabled: false
asyncFuncTimeout: 1000
description: Splunk-shaped output path for Juniper Mist records. Emits the Mist
  record as JSON in _raw with a flat sourcetype and a minimal set of top-level
  routing fields.
functions:
  - id: comment
    filter: "true"
    disabled: false
    conf:
      comment: |
        Pipeline : cribl_mist_to_splunk
        Purpose  : Splunk-shaped output. Serializes the Mist record to JSON in
                   _raw and strips everything the destination does not need, so
                   the payload is identical whether it lands in Splunk HEC, an
                   S3/Lake object or an HTTP destination.
        Author   : Cribl SE - @sduchene
        Updated  : 2026-09-11
        Upstream : cribl_mist_parse (via each in_mist_* Collector)
        Reached  : Route mist_to_splunk, which ships DISABLED. Enable it and set
                   mist_output_format = 'splunk' to use this pipeline.
        Vars     : mist_splunk_index - value written to 'index'

  # A single flat sourcetype for the whole vendor, which is what a Splunk TA-style
  # index-time config expects. This deliberately OVERWRITES the per-dataset
  # 'mist:<dataset>' sourcetype cribl_mist_parse sets - the dataset is still on the
  # event (and inside the JSON) as mist_dataset, so nothing is lost. Disable this
  # function if you would rather keep one sourcetype per dataset.
  - id: eval
    filter: "true"
    disabled: false
    groupId: emit
    description: "Flat Splunk sourcetype for every Mist dataset. Overrides the
      per-dataset mist:<dataset> sourcetype set by cribl_mist_parse."
    conf:
      add:
        # A quoted literal: Eval values are JS expressions, so bare juniper_mist
        # would be an undefined identifier and would DELETE the field.
        - name: sourcetype
          value: "'juniper_mist'"
      remove: []
      keep: []

  - id: eval
    filter: C.vars['mist_splunk_index'] !== ''
    disabled: false
    groupId: emit
    description: "Target index for Splunk-bound events. Set mist_splunk_index to
      an empty string to leave 'index' unset (S3/Lake/HTTP destinations)."
    conf:
      add:
        - name: index
          value: "C.vars['mist_splunk_index']"
      remove: []
      keep: []

  # --------------------------------------------------------------------------
  # Serialize. Exclusions first, '*' last - Cribl applies the field list in
  # order, so a leading '*' would swallow the negations.
  # The enrichment fields set by cribl_mist_parse (vendor, product, sourcetype,
  # host, mist_*) deliberately stay INSIDE the JSON document so the payload is
  # self-describing at rest.
  # --------------------------------------------------------------------------
  - id: serialize
    filter: "true"
    disabled: false
    groupId: emit
    description: Serialize the Mist record to a JSON document in _raw, excluding
      Cribl internal fields and the previous _raw.
    conf:
      type: json
      dstField: _raw
      fields:
        - "!_raw"
        - "!__*"
        - "!_*"
        - "!cribl_*"
        - "*"

  - id: eval
    filter: "true"
    disabled: false
    groupId: emit
    description: "Strict whitelist - emit _raw plus the routing and identity
      fields only. Wildcard removes run before keep, so keep wins."
    conf:
      add: []
      remove:
        - "*"
        - "__*"
        - "_*"
        - "cribl_*"
      keep:
        - _raw
        - _time
        - index
        - host
        - source
        - sourcetype
        - logtype
        - vendor
        - product
        # mist_dataset, mist_org_id, mist_site_id, mist_site_name,
        # mist_device_type, mist_api_error
        - mist_*
